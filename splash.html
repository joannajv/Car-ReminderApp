<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d0d0d0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Car Buddy" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/caricon.png" />
    <title>Car Buddy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="screen splash-screen redesigned-screen">
      <div class="splash-stack">
        <div class="splash-car-wrap" aria-hidden="true">
          <img class="splash-car splash-car--open" src="/assets/splash.png" width="166" alt="" />
          <img class="splash-car splash-car--wink" src="/assets/splash2.png" width="166" alt="" />
        </div>
        <h1 class="splash-title">Car Buddy</h1>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/supabase-config.js"></script>
    <script>
      (function () {
        function loginUrl() {
          return new URL("/login.html", window.location.origin).href;
        }
        function goLogin() {
          window.location.replace(loginUrl());
        }
        function startSplashSequence() {
          var holdMs = 2200;
          var fadeMs = 160;
          var el = document.querySelector(".screen.splash-screen");
          window.setTimeout(function () {
            if (el) el.classList.add("splash-is-leaving");
            window.setTimeout(goLogin, fadeMs);
          }, holdMs);
        }
        async function run() {
          if (window.getCarDemoSession) {
            try {
              var session = await window.getCarDemoSession();
              if (session) {
                window.location.replace(new URL("/index.html", window.location.origin).href);
                return;
              }
            } catch (e) {}
          }
          startSplashSequence();
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", run);
        } else {
          run();
        }
      })();
    </script>
  </body>
</html>
