<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d0d0d0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Car Buddy</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen splash-screen redesigned-screen">
      <div class="splash-stack">
        <div class="splash-car-wrap" aria-hidden="true">
          <img class="splash-car splash-car--open" src="assets/splash.png" width="166" alt="" />
          <img class="splash-car splash-car--wink" src="assets/splash2.png" width="166" alt="" />
        </div>
        <h1 class="splash-title">Car Buddy</h1>
      </div>
    </main>
    <script>
      (() => {
        const holdMs = 2200;
        const fadeMs = 160;
        const el = document.querySelector(".screen.splash-screen");
        setTimeout(() => {
          if (el) el.classList.add("splash-is-leaving");
          setTimeout(() => {
            window.location.replace("login.html");
          }, fadeMs);
        }, holdMs);
      })();
    </script>
  </body>
</html>
